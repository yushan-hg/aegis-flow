<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aegis">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Aegis Flow</title>
</head>
<body>
<div class="phone" id="phone">
  <header class="bar"><h1 id="title">Trang chủ</h1></header>
  <main class="screen" id="screen"></main>
  <nav class="nav" id="nav" aria-label="Tab">
    <button data-t="home"><b>◈</b><span></span></button>
    <button data-t="work"><b>☑</b><span></span></button>
    <button data-t="find"><b>⌕</b><span></span></button>
    <button data-t="more"><b>≡</b><span></span></button>
  </nav>
  <div class="toast" id="toast" role="status" hidden></div>
  <input id="fileInput" type="file" multiple hidden
         accept=".xlsx,.xlsm,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel">
</div>

<script src="vendor/xlsx.full.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
